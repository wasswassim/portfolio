<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1200 520" role="img" aria-labelledby="t">
  <title id="t">Italian and Tunisian flags side by side</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- dashed link between the two countries -->
  <path d="M340 140 Q600 40 860 140" fill="none" stroke="#c8ff00" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"/>
  <circle cx="340" cy="140" r="7" fill="#c8ff00"/>
  <circle cx="860" cy="140" r="7" fill="#c8ff00"/>
  <!-- Italy: vertical tricolour, 420x280 -->
  <g filter="url(#shadow)">
    <rect x="140" y="190" width="140" height="280" fill="#009246"/>
    <rect x="280" y="190" width="140" height="280" fill="#ffffff"/>
    <rect x="420" y="190" width="140" height="280" fill="#ce2b37"/>
  </g>
  <!-- Tunisia: official geometry (viewBox -60 -40 120 80) scaled 3.5x into 420x280 -->
  <g filter="url(#shadow)">
    <g transform="translate(850 330) scale(3.5)" fill="#e70013">
      <path d="M-60-40H60v80H-60z"/>
      <circle fill="#fff" r="20"/>
      <circle r="15"/>
      <circle fill="#fff" cx="4" r="12"/>
      <path d="M-5 0l16.281-5.29L1.22 8.56V-8.56L11.28 5.29z"/>
    </g>
  </g>
</svg>
